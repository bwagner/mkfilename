[project]
name = "mkfilename"
version = "0.2.0"
description = "Turn an arbitrary string into a robust filename: ASCII-only, lowercase, no spaces or shell-special chars."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bernhard Wagner", email = "gitcommit-bwagner@nosuch.biz" },
]
dependencies = []

[project.optional-dependencies]
cli = ["pyperclip"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=4",
    "ruff>=0.7",
    "pyperclip",
]

[project.scripts]
mkfilename = "mkfilename.__main__:main"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
    "if TYPE_CHECKING:",
]
