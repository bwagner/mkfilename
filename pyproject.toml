[project]
name = "mkfilename"
version = "0.1.0"
description = "Turn an arbitrary string into a robust filename: ASCII-only, no spaces or shell-special chars."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bernhard Wagner" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cli = ["pyperclip"]
dev = ["pytest>=8.0", "pyperclip"]

[project.scripts]
mkfilename = "mkfilename.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkfilename"]

[tool.pytest.ini_options]
testpaths = ["tests"]
